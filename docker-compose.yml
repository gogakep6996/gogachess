# =====================================================================
# gogachess: одна команда `docker compose up -d --build` поднимает
# Postgres + приложение. Перед стартом скопируйте .env.example в .env
# и поправьте переменные.
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gogachess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gogachess}
      POSTGRES_DB: ${POSTGRES_DB:-gogachess}
    # Тюнинг под маленький VPS (2 ГБ RAM). Дефолты postgres рассчитаны на
    # большие сервера; здесь срезаем shared_buffers и max_connections (Prisma
    # держит максимум 20 коннектов), чтобы БД не отъедала лишнюю память.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
    # Не даём БД съесть больше ~320 Мб RAM — защита от OOM соседних сервисов.
    mem_limit: 320m
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gogachess} -d ${POSTGRES_DB:-gogachess}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      # NEXT_PUBLIC_* нужны именно на сборке: Next вшивает их в клиентский код.
      # Поменять такой ключ можно только пересборкой (`up -d --build`) —
      # перезапуск контейнера ничего не изменит.
      args:
        NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY:-}
        # Пусто = используется встроенный резервный STUN из useAudioRoom.ts.
        NEXT_PUBLIC_ICE_SERVERS: ${NEXT_PUBLIC_ICE_SERVERS:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Ограничиваем heap V8, чтобы Node не разрастался бесконтрольно на 2 ГБ
      # сервере и не провоцировал OOM-killer. 768 Мб с запасом хватает для
      # текущей нагрузки; при росте онлайна поднять вместе с тарифом сервера.
      NODE_OPTIONS: --max-old-space-size=768
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # connection_limit=20: чтобы тикер турниров (несколько параллельных запросов
      # каждые 5 секунд) не упирался в дефолтный пул Prisma из 3 коннектов (ошибка P2024).
      DATABASE_URL: postgresql://${POSTGRES_USER:-gogachess}:${POSTGRES_PASSWORD:-gogachess}@db:5432/${POSTGRES_DB:-gogachess}?schema=public&connection_limit=20&pool_timeout=30
      SITE_URL: ${SITE_URL:-}
      # Resend — отправка писем (подтверждение email, сброс пароля). Без этих
      # переменных приложение переключается на «консольный» отправитель и письма
      # НЕ уходят клиентам (только в лог). Значения задавайте в .env на сервере.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # SMTP — приоритетный путь отправки писем (Яндекс 360 / Unisender / Mail.ru
      # и т.п.). Если SMTP_HOST задан, используется он; иначе — Resend; иначе лог.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Email'ы администраторов (через запятую) — кому доступна страница /admin/users
      # со списком зарегистрированных аккаунтов. Пусто = страница недоступна никому (404).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Серверный ключ капчи читается при запуске, поэтому он здесь, а его
      # клиентская пара — в build args выше. Задавать их нужно только вместе:
      # с одним серверным ключом бэкенд начнёт требовать токен, а виджет без
      # клиентского ключа его не выдаст — вход и регистрация сломаются у всех.
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      # NEXT_PUBLIC_ICE_SERVERS переехал в build args: в рантайме Next его уже
      # не читает. Это резервный список ICE-серверов, если сервер не ответит на
      # 'audio:get-ice-servers'. Основной путь — динамические HMAC-creds
      # для собственного coturn (см. ниже сервис `turn`).
      # Параметры собственного TURN — используются сервером для генерации коротких credentials.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-}
      TURN_HOST: ${TURN_HOST:-}
      # Стабилизирует Server Actions между пересборками (см. next.config.mjs).
      SERVER_ACTIONS_ENCRYPTION_KEY: ${SERVER_ACTIONS_ENCRYPTION_KEY:-}
    # На хосте 3001: внутри контейнера приложение всё ещё на 3000.
    # Так не конфликтует с шаблонным Node.js на VPS, который часто занимает :3000.
    ports:
      - "127.0.0.1:3001:3000"
    # Мягкий потолок памяти приложения. Чуть выше NODE_OPTIONS heap (768 Мб),
    # чтобы оставить место под не-heap память Node (буферы, WebSocket'ы).
    mem_limit: 1100m

  # ----------------------------------------------------------------------------
  # Собственный TURN/STUN-сервер (coturn).
  # Зачем: без этого аудио не проходит через мобильные операторы (CGNAT) и
  # многие корпоративные/гостиничные Wi-Fi, где UDP P2P-соединения зарезаны.
  #
  # network_mode: host — критически важно. Coturn использует случайные
  # high-порты (49152-65535/udp) для relay-каналов. Если их пробрасывать
  # через стандартный Docker NAT, Docker должен слушать ~16 000 портов, что
  # на практике не работает. С `host` контейнер слушает прямо на интерфейсе
  # VPS, без NAT-промежутка.
  #
  # Credentials НЕ статичные: сервер приложения генерирует HMAC-SHA1 от
  # `static-auth-secret` (RFC 7635), валидный 1 час. Утечка username/credential
  # из браузера не критична — через час они инвалидны.
  # ----------------------------------------------------------------------------
  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      # Сертификат от Let's Encrypt для TURNS (TLS). Read-only.
      - /etc/letsencrypt/live/${TURN_REALM:-gogachess.ru}:/certs/live:ro
      - /etc/letsencrypt/archive/${TURN_REALM:-gogachess.ru}:/certs/archive:ro
    # Параметры передаём аргументами (coturn все опции читает с CLI),
    # чтобы не возиться с конфиг-файлом и подстановками.
    # Минимально-достаточный набор: long-term creds через HMAC-secret + TLS-сертификат.
    command:
      - "turnserver"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--listening-ip=0.0.0.0"
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env}"
      - "--realm=${TURN_REALM:-gogachess.ru}"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}"
      - "--cert=/certs/live/fullchain.pem"
      - "--pkey=/certs/live/privkey.pem"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--no-cli"
      - "--log-file=stdout"
      # --verbose убран: в проде он зря грузит CPU и плодит огромные логи.
      # Включать только при отладке проблем с аудио.

volumes:
  db-data:
